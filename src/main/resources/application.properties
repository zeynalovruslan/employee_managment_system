spring.application.name=employee-management-system
server.port=9595

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.security.user.name=ruslan
app.security.user.password=${APP_USER_PASSWORD}

app.security.admin.name=admin
app.security.admin.password=${APP_ADMIN_PASSWORD}

app.security.hr.name=hr
app.security.hr.password=${APP_HR_PASSWORD}

login.first-password=${LOGIN_FIRST_PASSWORD}

work.work-start-time=09:00
work.work-end-time=18:00

logging.level.org.springframework.security=DEBUG

# SMTP server
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

server.error.include-message=always
server.error.include-binding-errors=always

#spring.datasource.url=jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.username=${MYSQL_USER}
#spring.datasource.password=${MYSQL_PASSWORD}

spring.datasource.url=${MYSQL_PASSWORD_URL_1}
spring.datasource.username=${MYSQL_USER_1}
spring.datasource.password=${MYSQL_PASSWORD_1}


